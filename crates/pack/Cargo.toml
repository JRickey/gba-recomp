[package]
name = "gba-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Packager: turn a mapped image into a distributable recompiled game binary"

[[bin]]
name = "gba-pack"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.11.0"
