name: release

# Tag a version to cut a release:  git tag v0.2.0 && git push origin v0.2.0
# Builds the CLI toolkit as portable archives and the launcher as the native
# desktop artifact for each platform, then attaches them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or SHA to build (no release is published)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            runs-on: macos-14
            target: universal-apple-darwin
          - name: linux-x86_64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
            echo "version=$ver" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      - name: macOS packaging dependencies
        if: matrix.name == 'macos-universal'
        run: brew install create-dmg

      # Build deps for the audio (ALSA), input (udev), window (X11/Wayland)
      # stacks, plus Linux desktop packaging. Built on the oldest supported
      # Ubuntu image so the glibc baseline stays portable.
      - name: Linux build dependencies
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxkbcommon-dev \
            libwayland-dev libgtk-3-dev pkg-config \
            desktop-file-utils flatpak flatpak-builder libfuse2

      - name: Build (universal macOS)
        if: matrix.name == 'macos-universal'
        shell: bash
        run: |
          cargo build --profile dist --target x86_64-apple-darwin
          cargo build --profile dist --target aarch64-apple-darwin
          mkdir -p dist/bin
          for b in recomp gba-pack gba-launcher; do
            lipo -create -output "dist/bin/$b" \
              "target/x86_64-apple-darwin/dist/$b" \
              "target/aarch64-apple-darwin/dist/$b"
            # Ad-hoc sign — Apple Silicon kills unsigned binaries on launch.
            codesign --force --sign - --timestamp=none "dist/bin/$b"
            codesign --verify --verbose "dist/bin/$b"
          done

      - name: Build (Linux / Windows)
        if: matrix.name != 'macos-universal'
        shell: bash
        run: |
          cargo build --profile dist --target ${{ matrix.target }}
          mkdir -p dist/bin
          EXE=""
          [ "${{ runner.os }}" = "Windows" ] && EXE=".exe"
          for b in recomp gba-pack gba-launcher; do
            cp "target/${{ matrix.target }}/dist/${b}${EXE}" "dist/bin/"
          done

      - name: Prepare Linux desktop packagers
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          mkdir -p dist/tools
          curl -L \
            -o dist/tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L \
            -o dist/tools/linuxdeploy-plugin-appimage-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x dist/tools/linuxdeploy-x86_64.AppImage dist/tools/linuxdeploy-plugin-appimage-x86_64.AppImage
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      # Build the bundled TinyCC fallback compiler so a local "build to play"
      # works on machines with no system C compiler. TCC_DIR is read by
      # package-release.sh on every platform; the emitted C marks the table
      # symbols __declspec(dllexport) so Windows DLLs export what the play
      # runtime resolves.
      - name: Build bundled TinyCC fallback (Linux)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          scripts/build-tcc.sh "$GITHUB_WORKSPACE/tccstage"
          echo "TCC_DIR=$GITHUB_WORKSPACE/tccstage/tcc" >> "$GITHUB_ENV"

      # The launcher bundle is universal, so the fallback compiler must be too:
      # libloading rejects a single-arch libtcc.dylib when the app is running
      # under the other slice. Build both TinyCC slices, lipo the dylib, and
      # stage the per-arch libtcc1.a archives separately; TinyCC's archive
      # format is not reliably lipo-readable on macOS, and recomp chooses the
      # matching archive directory at runtime.
      - name: Build bundled TinyCC fallback (universal macOS)
        if: matrix.name == 'macos-universal'
        shell: bash
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          TCC_CPU=arm64 TCC_CC=clang \
            TCC_EXTRA_CFLAGS="-arch arm64 -isysroot $SDKROOT" \
            TCC_EXTRA_LDFLAGS="-arch arm64 -isysroot $SDKROOT" \
            TCC_SYSINCLUDEPATHS="$SDKROOT/usr/include" \
            TCC_LIBPATHS="$SDKROOT/usr/lib" \
            TCC_CRTPREFIX="$SDKROOT/usr/lib" \
            scripts/build-tcc.sh "$GITHUB_WORKSPACE/tcc-arm64"
          TCC_CPU=x86_64 TCC_CC=clang \
            TCC_EXTRA_CFLAGS="-arch x86_64 -isysroot $SDKROOT" \
            TCC_EXTRA_LDFLAGS="-arch x86_64 -isysroot $SDKROOT" \
            TCC_SYSINCLUDEPATHS="$SDKROOT/usr/include" \
            TCC_LIBPATHS="$SDKROOT/usr/lib" \
            TCC_CRTPREFIX="$SDKROOT/usr/lib" \
            scripts/build-tcc.sh "$GITHUB_WORKSPACE/tcc-x86_64"
          mkdir -p "$GITHUB_WORKSPACE/tccstage/tcc"
          mkdir -p "$GITHUB_WORKSPACE/tccstage/tcc/arm64" "$GITHUB_WORKSPACE/tccstage/tcc/x86_64"
          cp -R "$GITHUB_WORKSPACE/tcc-arm64/tcc/include" "$GITHUB_WORKSPACE/tccstage/tcc/"
          cp "$GITHUB_WORKSPACE/tcc-arm64/tcc/COPYING" "$GITHUB_WORKSPACE/tccstage/tcc/"
          cp "$GITHUB_WORKSPACE/tcc-arm64/tcc/libtcc1.a" "$GITHUB_WORKSPACE/tccstage/tcc/arm64/libtcc1.a"
          cp "$GITHUB_WORKSPACE/tcc-x86_64/tcc/libtcc1.a" "$GITHUB_WORKSPACE/tccstage/tcc/x86_64/libtcc1.a"
          lipo -create \
            "$GITHUB_WORKSPACE/tcc-arm64/tcc/libtcc.dylib" \
            "$GITHUB_WORKSPACE/tcc-x86_64/tcc/libtcc.dylib" \
            -output "$GITHUB_WORKSPACE/tccstage/tcc/libtcc.dylib"
          lipo "$GITHUB_WORKSPACE/tccstage/tcc/libtcc.dylib" -verify_arch arm64 x86_64
          test -f "$GITHUB_WORKSPACE/tccstage/tcc/arm64/libtcc1.a"
          test -f "$GITHUB_WORKSPACE/tccstage/tcc/x86_64/libtcc1.a"
          echo "TCC_DIR=$GITHUB_WORKSPACE/tccstage/tcc" >> "$GITHUB_ENV"

      - name: Set up MSYS2 mingw toolchain (Windows TinyCC)
        if: matrix.name == 'windows-x86_64'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make
            git

      # cygpath -m hands the later git-bash packaging step a forward-slash
      # drive path (D:/…) both shells accept — no backslash pathing surprises.
      - name: Build bundled TinyCC fallback (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: msys2 {0}
        run: |
          scripts/build-tcc-windows.sh "$PWD/tccstage"
          echo "TCC_DIR=$(cygpath -m "$PWD/tccstage/tcc")" >> "$GITHUB_ENV"

      - name: Stage and archive bundles
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINDIR: dist/bin
          OUTDIR: dist/out
          RUNNER_OS: ${{ runner.os }}
          LINUXDEPLOY: ${{ github.workspace }}/dist/tools/linuxdeploy-x86_64.AppImage
          FLATPAK_RUNTIME_VERSION: "25.08"
        run: |
          [ "${{ runner.os }}" = "Windows" ] && export EXE=".exe"
          bash scripts/package-release.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundles-${{ matrix.target }}
          path: dist/out/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
